[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certifai-acv-engine"
version = "0.1.0"
description = "Avionics Contract & Verification Synthesis Engine (ACV-SE) - DO-178C DAL A Copilot"
authors = [{ name = "CertifAI Engineering Team" }]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=0.1.0",
    "google-generativeai>=0.7.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
acv = "acv_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acv_engine*"]
